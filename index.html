<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>الهروب من الظل 2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050814;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-moz-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;overflow:hidden;background:#050814}
canvas{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px;justify-content:space-between;z-index:5;direction:rtl}
.h{background:#10192be8;border:1px solid #3b4a68;border-radius:15px;padding:8px 10px;color:white;font-weight:bold;font-size:14px;box-shadow:0 5px 20px #0005}

#joystick{position:absolute;z-index:8;left:24px;bottom:max(24px,env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:#172238aa;border:2px solid #52617c88;touch-action:none;box-shadow:0 8px 30px #0005}
#stick{position:absolute;width:52px;height:52px;left:31px;top:31px;border-radius:50%;background:#38bdf8cc;border:2px solid #bae6fd;box-shadow:0 0 20px #38bdf888;pointer-events:none}
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;background:#02050bc4}
.card{width:min(84vw,390px);padding:25px;border:1px solid #52617c;border-radius:26px;background:#091123f5;color:#fff;text-align:center;box-shadow:0 20px 80px #000}
.card h1{font-size:34px;margin:0 0 12px}.card p{line-height:1.8;color:#d7deeb}
button{border:0;border-radius:17px;padding:14px 24px;font-size:18px;font-weight:bold;background:#38bdf8;color:#04101a}
#controls{position:absolute;z-index:7;bottom:max(18px,env(safe-area-inset-bottom));left:15px;right:15px;display:flex;justify-content:space-between;align-items:end}
#pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:6px;direction:ltr}
.ctrl{width:58px;height:58px;border-radius:17px;background:#172238dd;color:white;border:1px solid #52617c;font-size:25px}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#dash{width:76px;height:76px;border-radius:50%;background:#f59e0bcc;border:1px solid #fbbf24;color:#fff;font-size:27px}
#tip{position:absolute;z-index:6;bottom:150px;left:0;right:0;text-align:center;color:#aab7cc;font-size:13px;pointer-events:none}
</style>

<style>
#settingsBtn{position:absolute;z-index:100;top:10px;right:10px;width:48px;height:48px;border:1px solid #52617c;border-radius:15px;background:#10192bee;color:#fff;font-size:24px;cursor:pointer;touch-action:manipulation}
#settingsPanel{position:fixed;z-index:99;inset:0;display:none;align-items:center;justify-content:center;background:#02050be8;padding:20px;box-sizing:border-box}
.settingsCard{width:min(90vw,390px);max-height:90vh;overflow:auto;padding:22px;border-radius:24px;background:#17172bee;border:1px solid #52617c;color:#fff;text-align:center;box-shadow:0 20px 70px #000}
.settingsCard h2{margin:0 0 12px;font-size:30px}
.settingsCard p{margin:12px 0 7px;color:#e5e7eb;font-size:18px}
.choiceRow{display:flex;gap:8px}
.choice,.wideBtn,.closeBtn{flex:1;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:bold;background:#292943;color:#fff;touch-action:manipulation}
.choice.active{outline:3px solid #22d3ee;background:#213f5a}
.wideBtn,.closeBtn{width:100%;margin-top:9px}
.closeBtn{background:#38bdf8;color:#04101a}
.ideaBox{margin-top:16px;padding:15px;border-radius:18px;background:#1d1d33;line-height:1.8;font-size:16px}
.ideaBox strong{font-size:22px;letter-spacing:1px}
#arrowControls{position:fixed;z-index:20;right:18px;bottom:20px;display:none}
#pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px 58px;gap:6px}
.ctrl{width:58px;height:58px;border-radius:17px;background:#172238dd;color:#fff;border:1px solid #52617c;font-size:25px;touch-action:none;user-select:none;-webkit-user-select:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#settingsBtn,#settingsPanel,.settingsCard,.settingsCard button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
</style>

<style>
.brandAr{color:#ff2f6d!important;font-size:34px!important;margin-bottom:8px!important}
.brandEn{color:#19c9ff;font-size:52px;line-height:1;margin-bottom:18px}
#dashBtn{position:fixed;z-index:25;right:22px;bottom:max(24px,env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:#f59e0bcc;border:1px solid #fbbf24;color:#fff;font-size:28px;box-shadow:0 8px 25px #0007;touch-action:none;user-select:none;-webkit-user-select:none}
#dashBtn.cooldown{opacity:.45}
#boostStatus{position:fixed;z-index:25;right:28px;bottom:max(103px,calc(env(safe-area-inset-bottom) + 103px));color:#fde68a;font-size:12px;font-weight:bold;text-shadow:0 2px 5px #000;pointer-events:none}
#tip{bottom:165px}
</style>
</head>
<body>
<button id="settingsBtn" aria-label="الإعدادات">⚙️</button>
<div id="settingsPanel" aria-hidden="true">
  <div class="settingsCard">
    <h2>⚙️ الإعدادات</h2>
    <p>🎮 طريقة التحكم:</p>
    <div class="choiceRow">
      <button id="arrowMode" class="choice">الأسهم</button>
      <button id="freeMode" class="choice">التحرك الحر (Joystick)</button>
    </div>
    <p>🗺️ نوع الجيم:</p>
    <div class="choiceRow">
      <button id="closedMode" class="choice">🔒 جيم مغلق</button>
      <button id="openMode" class="choice">🌀 جيم مفتوح</button>
    </div>
    <p>🔊 الصوت:</p>
    <button id="soundToggle" class="wideBtn">مفعل 🔊</button>
    <div class="ideaBox">
      💡 عندك فكرة أو اقتراح جديد للعبة؟<br>
      ابعته على الرقم:<br>
      <strong>01271712158</strong>
      <button id="copyPhone" class="wideBtn">📋 نسخ الرقم</button>
    </div>
    <button id="closeSettings" class="closeBtn">⬅️ العودة للعبة</button>
  </div>
</div>
<div id="arrowControls" aria-label="تحكم الأسهم">
  <div id="pad">
    <button class="ctrl" id="up">▲</button>
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="down">▼</button>
    <button class="ctrl" id="right">▶</button>
  </div>
</div>

<div id="game">
<canvas id="c"></canvas>
<div id="hud">
 <div class="h">❤️ <span id="life">3</span></div>
 <div class="h">🔋 <span id="energy">0</span>/5</div>
 <div class="h">⭐ <span id="score">0</span></div>
 <div class="h">🏆 <span id="best">0</span></div>
</div>
<div id="tip">حرّك إصبعك في أي اتجاه للتحكم 👆</div>
<div id="joystick"><div id="stick"></div></div>
<button id="dashBtn" aria-label="السرعة">⚡</button>
<div id="boostStatus"></div>
<div id="screen">
 <div class="card">
  <h1 class="brandAr">محمد ضياء الصعب</h1>
  <div class="brandEn">Demons</div>
  <p>اجمع 5 كرات، افتح البوابة، واهرب من الوحوش.<br>كل مرحلة تصبح أصعب مع الوقت.</p>
  <button id="start">ابدأ اللعب 🚀</button>
 </div>
</div>
</div>

<script>
'use strict';

document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('copy',e=>e.preventDefault());

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let w=0,h=0,dpr=1,playing=false,last=0,score=0,life=3,energy=0,level=1;
let best=Number(localStorage.getItem('shadowBest2')||0);
let invuln=0, freezeUntil=0, boostCooldown=0, soundOn=localStorage.getItem('soundOn')!=='off';
let controlMode=localStorage.getItem('controlMode')||'free';
let gameMode=localStorage.getItem('gameMode')||'closed';

const keys={up:false,down:false,left:false,right:false};
const touchMove={x:0,y:0,active:false};
const player={x:0,y:0,r:17,speed:225,boost:0};
let enemies=[],cells=[],freezeBalls=[],heart=null,particles=[],stars=[];
let gate={x:0,y:0,r:29};

const $=id=>document.getElementById(id);
const lifeEl=$('life'),energyEl=$('energy'),scoreEl=$('score'),bestEl=$('best');

function resize(){
  dpr=Math.min(devicePixelRatio||1,2); w=innerWidth; h=innerHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);makeStars();
}
function makeStars(){stars=Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.7,a:.2+Math.random()*.7}))}
addEventListener('resize',resize);resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function randomPos(m=45){
  return {x:m+Math.random()*Math.max(1,w-m*2),y:85+Math.random()*Math.max(20,h-155)}
}
function wrap(obj){
  if(obj.x<0)obj.x=w;
  if(obj.x>w)obj.x=0;
  if(obj.y<65)obj.y=h-1;
  if(obj.y>h)obj.y=65;
}
function moveWithin(obj){
  if(gameMode==='open') wrap(obj);
  else {
    obj.x=clamp(obj.x,20,w-20);
    obj.y=clamp(obj.y,75,h-20);
  }
}

function enemyCount(){
  if(level>=10)return 3;
  if(level>=5)return 2;
  return 1;
}
function spawnEnemies(){
  enemies=[];
  const count=enemyCount();
  for(let i=0;i<count;i++){
    const p={x:Math.random()<.5?28:w-28,y:100+Math.random()*Math.max(30,h-180)};
    enemies.push({x:p.x,y:p.y,r:23,speed:90,isBoss:false});
  }
  if(level%10===0){
    const p=randomPos(80);
    enemies.push({x:p.x,y:p.y,r:34,speed:95,isBoss:true});
  }
  setEnemySpeeds();
}
function setEnemySpeeds(){
  const normalCap=player.speed*.82;
  const bossCap=player.speed*.76;
  enemies.forEach((e,i)=>{
    const raw=88+Math.min(level*9,105)+(e.isBoss?12:0)+(i*3);
    e.speed=Math.min(raw,e.isBoss?bossCap:normalCap);
  });
}

function newRound(){
  player.x=w/2;player.y=h/2;player.boost=0;
  gate=randomPos(55);gate.r=29;
  cells=[];
  for(let i=0;i<5;i++){let q=randomPos(45);cells.push({...q,r:11,p:Math.random()*6.28})}
  freezeBalls=[];
  const freezeCount=Math.min(3,1+Math.floor(level/5));
  for(let i=0;i<freezeCount;i++){let q=randomPos(45);freezeBalls.push({...q,r:13,p:Math.random()*6.28})}
  heart=life<3?{...randomPos(55),r:14,p:0}:null;
  spawnEnemies();
  invuln=.7;
  updateHud();
}

function start(){
  score=0;life=3;energy=0;level=1;playing=true;
  $('screen').style.display='none';
  newRound();updateHud();
}

function updateHud(){
  lifeEl.textContent=life;energyEl.textContent=energy;scoreEl.textContent=score;bestEl.textContent=best;
  $('boostStatus').textContent=player.boost>0?`⚡ ${player.boost.toFixed(1)}ث`:(boostCooldown>0?`⏳ ${boostCooldown.toFixed(1)}ث`:'⚡ جاهز');
  $('dashBtn').classList.toggle('cooldown',boostCooldown>0||player.boost>0);
}

function burst(x,y,n=20,type='normal'){
  const color=type==='freeze'?'#60a5fa':type==='heart'?'#fb7185':'#facc15';
  for(let i=0;i<n;i++){
    let a=Math.random()*Math.PI*2,s=40+Math.random()*150;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+Math.random()*.45,color});
  }
}

function hit(){
  if(invuln>0)return;
  life--;invuln=1.1;burst(player.x,player.y,30);
  player.x=w/2;player.y=h/2;
  enemies.forEach((e,i)=>{e.x=i%2? w-25:25;e.y=100+Math.random()*Math.max(30,h-180)});
  if(life<=0)endGame();
  else if(life<3)heart={...randomPos(55),r:14,p:0};
  updateHud();
}

function endGame(){
  playing=false;
  if(score>best){best=score;localStorage.setItem('shadowBest2',best)}
  $('screen').querySelector('.card').innerHTML=
    `<h1>💀 انتهت الجولة</h1><p>النقاط: <b>${score}</b><br>المرحلة: <b>${level}</b><br>أفضل نتيجة: <b>${best}</b></p><button id="again">العب من جديد</button>`;
  $('screen').style.display='flex';
  $('again').onclick=start;
}

function activateBoost(){
  if(!playing||boostCooldown>0)return;
  player.boost=.75;boostCooldown=3.0;updateHud();
}
$('dashBtn').addEventListener('pointerdown',e=>{e.preventDefault();activateBoost()},{passive:false});

function collectEnergy(i){
  const c=cells[i];score+=100;energy++;
  burst(c.x,c.y,14);cells.splice(i,1);updateHud();
}
function collectFreeze(i){
  const c=freezeBalls[i];freezeUntil=performance.now()+3000;
  score+=150;burst(c.x,c.y,24,'freeze');freezeBalls.splice(i,1);updateHud();
}
function collectHeart(){
  if(!heart||life>=3)return;
  life++;score+=75;burst(heart.x,heart.y,25,'heart');heart=null;updateHud();
}

function nextLevel(){
  score+=500;level++;energy=0;newRound();updateHud();burst(gate.x,gate.y,45);
}

function update(dt){
  let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
  if(controlMode==='free'&&touchMove.active){dx=touchMove.x;dy=touchMove.y}
  if(dx||dy){
    let len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}
    const spd=player.speed*(player.boost>0?2.35:1);
    player.x+=dx*spd*dt;player.y+=dy*spd*dt;
  }
  moveWithin(player);
  player.boost=Math.max(0,player.boost-dt);
  boostCooldown=Math.max(0,boostCooldown-dt);
  invuln=Math.max(0,invuln-dt);
  updateHud();

  const frozen=performance.now()<freezeUntil;
  if(!frozen){
    enemies.forEach(enemy=>{
      const ang=Math.atan2(player.y-enemy.y,player.x-enemy.x);
      enemy.x+=Math.cos(ang)*enemy.speed*dt;
      enemy.y+=Math.sin(ang)*enemy.speed*dt;
      moveWithin(enemy);
    });
  }

  for(let i=cells.length-1;i>=0;i--)if(distance(player,cells[i])<player.r+cells[i].r)collectEnergy(i);
  for(let i=freezeBalls.length-1;i>=0;i--)if(distance(player,freezeBalls[i])<player.r+freezeBalls[i].r)collectFreeze(i);
  if(heart&&life<3&&distance(player,heart)<player.r+heart.r)collectHeart();

  if(energy>=5&&distance(player,gate)<player.r+gate.r)nextLevel();

  for(const enemy of enemies){
    if(distance(player,enemy)<player.r+enemy.r)hit();
  }

  particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;q.life-=dt});
  particles=particles.filter(q=>q.life>0);
}

function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#050814';ctx.fillRect(0,0,w,h);
  for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
  ctx.strokeStyle='#14213a';ctx.lineWidth=1;
  for(let x=0;x<w;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=60;y<h;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}

  ctx.beginPath();ctx.arc(gate.x,gate.y,gate.r,0,Math.PI*2);
  ctx.strokeStyle=energy>=5?'#34d399':'#52617c';ctx.lineWidth=5;ctx.stroke();
  ctx.font='25px Arial';ctx.textAlign='center';ctx.fillText('🚪',gate.x,gate.y+9);

  for(const c of cells){
    c.p+=.04;ctx.beginPath();ctx.arc(c.x,c.y,c.r+Math.sin(c.p)*2,0,Math.PI*2);
    ctx.fillStyle='#facc15';ctx.shadowBlur=22;ctx.shadowColor='#facc15';ctx.fill();ctx.shadowBlur=0;
  }

  for(const c of freezeBalls){
    c.p+=.06;ctx.beginPath();ctx.arc(c.x,c.y,c.r+Math.sin(c.p)*2,0,Math.PI*2);
    ctx.fillStyle='#60a5fa';ctx.shadowBlur=25;ctx.shadowColor='#60a5fa';ctx.fill();ctx.shadowBlur=0;
    ctx.font='16px Arial';ctx.fillText('❄️',c.x,c.y+6);
  }

  if(heart&&life<3){
    heart.p+=.06;ctx.font='27px Arial';ctx.fillText('❤️',heart.x,heart.y+9);
  }

  const frozen=performance.now()<freezeUntil;
  for(const enemy of enemies){
    ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.r,0,Math.PI*2);
    ctx.fillStyle=enemy.isBoss?'#7c3aed':'#8b1e3f';ctx.fill();
    ctx.font=enemy.isBoss?'30px Arial':'23px Arial';ctx.fillText(enemy.isBoss?'👹':'👁️',enemy.x,enemy.y+8);
    if(frozen){
      ctx.beginPath();ctx.arc(enemy.x,enemy.y,enemy.r+8,0,Math.PI*2);
      ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;ctx.stroke();
    }
  }

  ctx.globalAlpha=invuln>0&&Math.floor(invuln*12)%2?0.35:1;
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle='#38bdf8';ctx.shadowBlur=22;ctx.shadowColor='#38bdf8';ctx.fill();ctx.shadowBlur=0;
  ctx.font='20px Arial';ctx.fillText('🧑',player.x,player.y+8);ctx.globalAlpha=1;

  if(frozen){
    ctx.font='18px Arial';ctx.fillStyle='#bfdbfe';ctx.fillText('❄️ الوحش متجمد',w/2,70);
  }
  for(const q of particles){
    ctx.globalAlpha=Math.max(0,q.life*1.5);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,4,4)
  }
  ctx.globalAlpha=1;
}

function loop(t){
  let dt=Math.min(.035,(t-last)/1000||0);last=t;
  if(playing)update(dt);draw();requestAnimationFrame(loop);
}

/* Joystick */
const joystick=$('joystick'),stick=$('stick');
function moveStick(e){
  const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy,max=40,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max}
  stick.style.transform=`translate(${dx}px,${dy}px)`;
  touchMove.x=dx/max;touchMove.y=dy/max;touchMove.active=true;
}
function resetStick(){stick.style.transform='translate(0,0)';touchMove.x=0;touchMove.y=0;touchMove.active=false}
joystick.addEventListener('pointerdown',e=>{
  if(controlMode!=='free')return;
  e.preventDefault();e.stopPropagation();joystick.setPointerCapture?.(e.pointerId);moveStick(e);
},{passive:false});
joystick.addEventListener('pointermove',e=>{
  if(controlMode==='free'&&touchMove.active){e.preventDefault();moveStick(e)}
},{passive:false});
['pointerup','pointercancel'].forEach(ev=>joystick.addEventListener(ev,e=>{e.preventDefault();resetStick()},{passive:false}));

/* Arrow controls */
function bindArrow(id,key){
  const b=$(id);if(!b)return;
  b.addEventListener('pointerdown',e=>{
    if(controlMode!=='arrows')return;e.preventDefault();keys[key]=true;
  },{passive:false});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{
    e.preventDefault();keys[key]=false;
  },{passive:false}));
}
bindArrow('up','up');bindArrow('down','down');bindArrow('left','left');bindArrow('right','right');

addEventListener('keydown',e=>{
  const m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];
  if(m)keys[m]=true;
});
addEventListener('keyup',e=>{
  const m={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'}[e.key];
  if(m)keys[m]=false;
});

/* Settings */
const panel=$('settingsPanel');
function setPanel(open){panel.style.display=open?'flex':'none';panel.setAttribute('aria-hidden',open?'false':'true')}
function active(id,on){$(id)?.classList.toggle('active',on)}
function applyControlMode(mode){
  controlMode=mode;localStorage.setItem('controlMode',mode);
  $('arrowControls').style.display=mode==='arrows'?'block':'none';
  joystick.style.display=mode==='free'?'block':'none';
  $('tip').textContent=mode==='arrows'?'استخدم الأسهم للتحرك 🎮':'حرّك إصبعك في أي اتجاه للتحكم 👆';
  active('arrowMode',mode==='arrows');active('freeMode',mode==='free');resetStick();
}
function applyGameMode(mode){gameMode=mode;localStorage.setItem('gameMode',mode);active('closedMode',mode==='closed');active('openMode',mode==='open')}
$('settingsBtn').addEventListener('pointerup',e=>{e.preventDefault();setPanel(true)});
$('closeSettings').addEventListener('pointerup',e=>{e.preventDefault();setPanel(false)});
panel.addEventListener('pointerup',e=>{if(e.target===panel)setPanel(false)});
$('arrowMode').addEventListener('pointerup',()=>applyControlMode('arrows'));
$('freeMode').addEventListener('pointerup',()=>applyControlMode('free'));
$('closedMode').addEventListener('pointerup',()=>applyGameMode('closed'));
$('openMode').addEventListener('pointerup',()=>applyGameMode('open'));
$('soundToggle').addEventListener('pointerup',()=>{
  soundOn=!soundOn;localStorage.setItem('soundOn',soundOn?'on':'off');
  $('soundToggle').textContent=soundOn?'مفعل 🔊':'مغلق 🔇';
});
$('copyPhone').addEventListener('pointerup',async()=>{
  try{await navigator.clipboard.writeText('01271712158');$('copyPhone').textContent='✅ تم نسخ الرقم';setTimeout(()=>$('copyPhone').textContent='📋 نسخ الرقم',1200)}catch(e){}
});

applyControlMode(controlMode);applyGameMode(gameMode);
$('soundToggle').textContent=soundOn?'مفعل 🔊':'مغلق 🔇';
$('start').onclick=start;
requestAnimationFrame(loop);
</script>

</body>
</html>
